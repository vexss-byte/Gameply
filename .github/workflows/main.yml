name: Build Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # biar bisa dijalankan manual dari tab Actions

permissions:
  contents: write      # dibutuhkan untuk bikin Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Pakai Gradle langsung, jadi tidak wajib ada gradlew di repo
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ritelock-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Kalau push tag, contoh: git tag v1.0.0 && git push origin v1.0.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
