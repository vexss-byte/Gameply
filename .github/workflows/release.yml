name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build (versi dari tag)
        run: gradle build -Pmod_version="${GITHUB_REF_NAME#v}" --stacktrace

      - name: Kumpulkan JAR
        run: |
          mkdir dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
